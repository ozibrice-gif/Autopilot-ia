<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nexus AI — Studio Conversationnel & Raisonnement</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #090d16; color: #f8fafc; }
    .glass { background: rgba(15, 23, 42, 0.86); backdrop-filter: blur(14px); border: 1px solid rgba(99, 102, 241, 0.22); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    pre code { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <!-- EN-TÊTE -->
  <header class="sticky top-0 z-30 glass border-b border-slate-800 px-3 sm:px-5 py-3">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 via-violet-600 to-fuchsia-600 flex items-center justify-center shadow-lg shadow-indigo-500/25">
          <i class="fa-solid fa-brain text-white text-sm"></i>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="font-extrabold text-sm sm:text-base tracking-tight text-white">Nexus AI</h1>
            <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full bg-indigo-500/15 text-indigo-300 border border-indigo-500/30">Omni-Mode</span>
          </div>
          <p id="status-subtitle" class="text-[11px] text-slate-400 hidden sm:block">Raisonnement multi-tours • Code • Analyse • Rédaction • Outils</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5 sm:gap-2">
        <select id="mode-select" onchange="changeMode(this.value)" class="bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-1.5 text-xs font-semibold text-indigo-200 focus:outline-none focus:border-indigo-500">
          <option value="omni">Mode : Omni (Tout-en-un)</option>
          <option value="reasoning">Mode : Raisonnement profond</option>
          <option value="code">Mode : Ingénieur Code</option>
          <option value="analyst">Mode : Analyste & Chiffres</option>
          <option value="writer">Mode : Rédaction & Stratégie</option>
        </select>

        <button type="button" onclick="toggleSettings()" class="px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-700 transition">
          <i class="fa-solid fa-sliders text-amber-400"></i><span class="hidden sm:inline ml-1">Réglages</span>
        </button>

        <button type="button" onclick="newConversation()" class="px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white transition">
          <i class="fa-solid fa-plus"></i><span class="hidden sm:inline ml-1">Nouveau</span>
        </button>
      </div>
    </div>
  </header>

  <!-- PANNEAU RÉGLAGES (CLÉ API, TEMPÉRATURE, AUTOMATISATION / WEBHOOK) -->
  <div id="settings-panel" class="hidden max-w-6xl w-full mx-auto px-3 sm:px-5 pt-3">
    <div class="glass rounded-2xl p-4 grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
      <div class="space-y-1">
        <label class="block font-semibold text-slate-300">Clé API Gemini (optionnelle)</label>
        <div class="flex gap-1.5">
          <input id="api-key-input" type="password" placeholder="AIzaSy..." class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-2 text-white focus:outline-none focus:border-indigo-500">
          <button type="button" onclick="saveSettings()" class="px-3 py-2 rounded-lg bg-indigo-600 text-white font-semibold">OK</button>
        </div>
      </div>

      <div class="space-y-1">
        <label class="block font-semibold text-slate-300">Style de réponse</label>
        <select id="style-select" onchange="saveSettings()" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-2 text-white focus:outline-none focus:border-indigo-500">
          <option value="balanced">Équilibré (clair, structuré, complet)</option>
          <option value="concise">Direct & synthétique</option>
          <option value="deep">Très approfondi & méthodique</option>
        </select>
      </div>

      <div class="space-y-1">
        <label class="block font-semibold text-slate-300">Endpoint Action / Mail (optionnel)</label>
        <input id="action-webhook-input" onchange="saveSettings()" type="url" placeholder="https://votre-api-ou-webhook.com" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-2 text-white focus:outline-none focus:border-indigo-500">
      </div>
    </div>
  </div>

  <!-- CORPS PRINCIPAL : HISTORIQUE LATÉRAL + ZONE DE CONVERSATION -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-3 sm:px-5 py-4 grid grid-cols-1 lg:grid-cols-12 gap-4">

    <!-- COLONNE GAUCHE : SESSIONS & RACCOURCIS -->
    <aside class="lg:col-span-3 space-y-3">
      <div class="glass rounded-2xl p-3.5 space-y-2.5">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-slate-200 uppercase tracking-wider">Conversations</span>
          <button type="button" onclick="clearAllSessions()" class="text-[11px] text-rose-400 hover:underline">Vider</button>
        </div>
        <div id="sessions-list" class="space-y-1.5 max-h-48 lg:max-h-72 overflow-y-auto no-scrollbar"></div>
      </div>

      <div class="glass rounded-2xl p-3.5 space-y-2">
        <span class="text-xs font-bold text-slate-200 uppercase tracking-wider block">Capacités rapides</span>
        <button type="button" onclick="usePromptPreset('Explique le problème étape par étape, identifie les hypothèses cachées et propose un plan d\'action concret pour : ')" class="w-full text-left text-xs px-2.5 py-2 rounded-xl bg-slate-900/90 hover:bg-indigo-600/25 border border-slate-800 text-slate-300 transition">
          <i class="fa-solid fa-sitemap text-indigo-400 mr-1.5"></i> Raisonner & structurer
        </button>
        <button type="button" onclick="usePromptPreset('Écris une solution de code propre, commentée et prête à l\'emploi pour : ')" class="w-full text-left text-xs px-2.5 py-2 rounded-xl bg-slate-900/90 hover:bg-indigo-600/25 border border-slate-800 text-slate-300 transition">
          <i class="fa-solid fa-code text-emerald-400 mr-1.5"></i> Générer / corriger du code
        </button>
        <button type="button" onclick="usePromptPreset('Analyse les chiffres, compare les options dans un tableau clair et donne une recommandation argumentée sur : ')" class="w-full text-left text-xs px-2.5 py-2 rounded-xl bg-slate-900/90 hover:bg-indigo-600/25 border border-slate-800 text-slate-300 transition">
          <i class="fa-solid fa-chart-column text-amber-400 mr-1.5"></i> Analyser & comparer
        </button>
      </div>
    </aside>

    <!-- COLONNE DROITE : FIL DE DISCUSSION & SAISIE -->
    <section class="lg:col-span-9 flex flex-col glass rounded-2xl overflow-hidden min-h-[72vh]">
      <div id="chat-messages" class="flex-1 p-4 sm:p-5 space-y-4 overflow-y-auto max-h-[62vh]"></div>

      <!-- ZONE DE SAISIE -->
      <div class="border-t border-slate-800 bg-slate-950/90 p-3 sm:p-4 space-y-2">
        <div class="flex items-center justify-between gap-2 text-[11px] text-slate-400 flex-wrap">
          <div class="flex items-center gap-3">
            <label for="file-attach-input" class="text-emerald-400 hover:underline cursor-pointer">
              <i class="fa-solid fa-paperclip mr-1"></i>Joindre fichier texte
            </label>
            <input type="file" id="file-attach-input" accept=".txt,.md,.csv,.json,.js,.py,.html,.log,text/*" onchange="attachTextFile(event)" class="hidden">
            <button type="button" onclick="openMailDraftModal()" class="text-indigo-300 hover:underline">
              <i class="fa-solid fa-envelope mr-1"></i>Préparer / Envoyer mail
            </button>
          </div>
          <span id="attached-file-label" class="text-emerald-300 truncate max-w-[220px]"></span>
        </div>

        <div class="flex items-end gap-2">
          <textarea id="user-prompt" rows="2" placeholder="Demandez n'importe quoi : raisonnement, code, analyse, stratégie, rédaction, calcul..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 resize-none" onkeydown="if(event.key==='Enter' && !event.shiftKey){ event.preventDefault(); sendMessage(); }"></textarea>
          <button type="button" id="send-btn" onclick="sendMessage()" class="px-4 sm:px-5 py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold text-sm shadow-lg shadow-indigo-600/25 transition shrink-0">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </section>
  </main>
  <!-- MODAL ENVOI D'E-MAIL / ACTION EXTERNE -->
  <div id="mail-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-5 space-y-3.5">
      <div class="flex items-center justify-between">
        <h3 class="font-bold text-base text-white flex items-center gap-2">
          <i class="fa-solid fa-envelope-circle-check text-indigo-400"></i> Envoyer / Préparer un e-mail
        </h3>
        <button type="button" onclick="closeMailDraftModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <input id="draft-mail-to" type="email" placeholder="Destinataire (ex: contact@entreprise.com)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
      <input id="draft-mail-subject" type="text" placeholder="Objet de l'e-mail" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
      <textarea id="draft-mail-body" rows="6" placeholder="Contenu de l'e-mail..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-indigo-500"></textarea>
      <div id="draft-mail-feedback" class="text-[11px] text-slate-400"></div>
      <div class="flex items-center justify-end gap-2">
        <button type="button" onclick="closeMailDraftModal()" class="px-3 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold">Fermer</button>
        <button type="button" onclick="submitMailDraft()" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold">
          <i class="fa-solid fa-paper-plane mr-1"></i> Envoyer / Ouvrir Mail
        </button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'nexus_ai_sessions_v1';
    const SETTINGS_KEY = 'nexus_ai_settings_v1';

    const defaultSettings = {
      apiKey: '',
      mode: 'omni',
      style: 'balanced',
      webhookUrl: ''
    };

    let settings = { ...defaultSettings, ...JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}') };
    let sessions = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let activeSessionId = null;
    let attachedFileText = '';
    let attachedFileName = '';

    function createNewSession(initialTitle = 'Nouvelle conversation') {
      const id = 'sess-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
      const session = {
        id,
        title: initialTitle,
        mode: settings.mode,
        updatedAt: new Date().toISOString(),
        messages: [
          {
            role: 'assistant',
            content: [
              'Bonjour. Je suis Nexus AI, configuré pour raisonner de manière structurée, écrire et analyser du code, croiser des chiffres ou des options, et garder le fil de nos échanges.',
              '',
              'Comment puis-je vous aider aujourd\'hui ? Indiquez votre objectif, vos contraintes et le format souhaité.'
            ].join('\n'),
            timestamp: new Date().toISOString()
          }
        ]
      };
      sessions.unshift(session);
      activeSessionId = id;
      persistSessions();
      return session;
    }

    function ensureActiveSession() {
      if (!Array.isArray(sessions) || sessions.length === 0) {
        sessions = [];
        return createNewSession();
      }
      let current = sessions.find(s => s.id === activeSessionId);
      if (!current) {
        current = sessions[0];
        activeSessionId = current.id;
      }
      return current;
    }

    function persistSessions() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions.slice(0, 30)));
    }

    function saveSettings() {
      settings.apiKey = (document.getElementById('api-key-input')?.value || '').trim();
      settings.mode = document.getElementById('mode-select')?.value || 'omni';
      settings.style = document.getElementById('style-select')?.value || 'balanced';
      settings.webhookUrl = (document.getElementById('action-webhook-input')?.value || '').trim();
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
      updateSubtitle();
    }

    function syncSettingsUI() {
      if (document.getElementById('api-key-input')) document.getElementById('api-key-input').value = settings.apiKey || '';
      if (document.getElementById('mode-select')) document.getElementById('mode-select').value = settings.mode || 'omni';
      if (document.getElementById('style-select')) document.getElementById('style-select').value = settings.style || 'balanced';
      if (document.getElementById('action-webhook-input')) document.getElementById('action-webhook-input').value = settings.webhookUrl || '';
      updateSubtitle();
    }

    function updateSubtitle() {
      const modeLabels = {
        omni: 'Mode Omni',
        reasoning: 'Raisonnement profond',
        code: 'Ingénieur Code',
        analyst: 'Analyste & Chiffres',
        writer: 'Rédaction & Stratégie'
      };
      const engineLabel = settings.apiKey ? 'Gemini connecté' : 'Moteur raisonné local + API';
      const el = document.getElementById('status-subtitle');
      if (el) el.textContent = `${modeLabels[settings.mode] || 'Mode Omni'} • ${engineLabel}`;
    }

    function toggleSettings() {
      document.getElementById('settings-panel').classList.toggle('hidden');
    }

    function changeMode(newMode) {
      settings.mode = newMode;
      const session = ensureActiveSession();
      session.mode = newMode;
      saveSettings();
      persistSessions();
    }

    function newConversation() {
      createNewSession();
      renderSessions();
      renderMessages();
    }

    function selectSession(id) {
      activeSessionId = id;
      const s = ensureActiveSession();
      settings.mode = s.mode || settings.mode;
      syncSettingsUI();
      renderSessions();
      renderMessages();
    }

    function clearAllSessions() {
      if (!confirm('Supprimer toutes les conversations enregistrées ?')) return;
      sessions = [];
      localStorage.removeItem(STORAGE_KEY);
      createNewSession();
      renderSessions();
      renderMessages();
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatInline(text) {
      return escapeHtml(text)
        .replace(/\*\*(.*?)\*\*/g, '<strong class="text-white font-semibold">$1</strong>')
        .replace(/`([^`]+)`/g, '<code class="px-1.5 py-0.5 rounded bg-slate-800 text-indigo-300 text-xs font-mono">$1</code>');
    }

    function renderRichContent(rawText) {
      const text = String(rawText || '');
      const parts = text.split(/(```[\s\S]*?```)/g);
      let html = '';

      for (const part of parts) {
        if (!part) continue;
        if (part.startsWith('```') && part.endsWith('```')) {
          const inner = part.slice(3, -3);
          const firstBreak = inner.indexOf('\n');
          const lang = firstBreak > -1 ? inner.slice(0, firstBreak).trim() : '';
          const code = firstBreak > -1 ? inner.slice(firstBreak + 1) : inner;
          html += `
            <div class="my-2.5 rounded-xl overflow-hidden border border-slate-700 bg-slate-950">
              <div class="flex items-center justify-between px-3 py-1.5 bg-slate-900 border-b border-slate-800 text-[11px] text-slate-400">
                <span class="font-mono text-indigo-300">${escapeHtml(lang || 'code')}</span>
                <button type="button" onclick="copyRawText(decodeURIComponent('${encodeURIComponent(code)}'))" class="hover:text-white">
                  <i class="fa-regular fa-copy mr-1"></i>Copier
                </button>
              </div>
              <pre class="p-3 overflow-x-auto text-xs text-emerald-200 leading-relaxed"><code>${escapeHtml(code.trim())}</code></pre>
            </div>
          `;
          continue;
        }

        const lines = part.split('\n');
        let tableBuffer = [];

        const flushTable = () => {
          if (!tableBuffer.length) return;
          const rows = tableBuffer
            .filter(r => !/^\s*\|?[\s:-]+(?:\|[\s:-]+)+\|?\s*$/.test(r.trim()))
            .map(r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim()));
          if (rows.length) {
            const [head, ...body] = rows;
            html += '<div class="my-2.5 overflow-x-auto rounded-xl border border-slate-700/80 bg-slate-900/90">';
            html += '<table class="min-w-[480px] w-full text-left border-collapse text-xs">';
            html += '<thead class="bg-slate-800 text-indigo-300 border-b border-slate-700"><tr>' +
              head.map(h => `<th class="px-3 py-2 font-bold">${formatInline(h)}</th>`).join('') +
              '</tr></thead><tbody class="divide-y divide-slate-800/80">';
            body.forEach(row => {
              html += '<tr>' + row.map(cell => `<td class="px-3 py-2 text-slate-200 align-top">${formatInline(cell)}</td>`).join('') + '</tr>';
            });
            html += '</tbody></table></div>';
          }
          tableBuffer = [];
        };

        for (const line of lines) {
          const trimmed = line.trim();
          if (trimmed.includes('|') && (trimmed.startsWith('|') || trimmed.split('|').length >= 3)) {
            tableBuffer.push(trimmed);
          } else {
            flushTable();
            if (!trimmed) {
              html += '<div class="h-2"></div>';
            } else if (/^#{1,4}\s+/.test(trimmed)) {
              const heading = trimmed.replace(/^#{1,4}\s+/, '');
              html += `<h4 class="font-bold text-white text-sm mt-2.5 mb-1">${formatInline(heading)}</h4>`;
            } else if (/^[-*•]\s+/.test(trimmed)) {
              const item = trimmed.replace(/^[-*•]\s+/, '');
              html += `<div class="flex items-start gap-2 my-1 text-xs sm:text-sm text-slate-200"><span class="text-indigo-400 mt-0.5">•</span><span>${formatInline(item)}</span></div>`;
            } else {
              html += `<p class="text-xs sm:text-sm text-slate-200 leading-relaxed my-1">${formatInline(trimmed)}</p>`;
            }
          }
        }
        flushTable();
      }

      return html;
    }

    function renderSessions() {
      const container = document.getElementById('sessions-list');
      if (!container) return;
      container.innerHTML = sessions.map(s => {
        const isActive = s.id === activeSessionId;
        return `
          <button type="button" onclick="selectSession('${s.id}')" class="w-full text-left px-2.5 py-2 rounded-xl text-xs truncate transition ${
            isActive
              ? 'bg-indigo-600 text-white font-semibold shadow'
              : 'bg-slate-900/80 text-slate-300 hover:bg-slate-800'
          }">
            ${escapeHtml(s.title || 'Conversation')}
          </button>
        `;
      }).join('');
    }

    function renderMessages() {
      const session = ensureActiveSession();
      const box = document.getElementById('chat-messages');
      if (!box) return;

      box.innerHTML = session.messages.map((msg, index) => {
        const isUser = msg.role === 'user';
        return `
          <div class="flex ${isUser ? 'justify-end' : 'justify-start'}">
            <div class="max-w-[92%] sm:max-w-[82%] rounded-2xl p-3.5 sm:p-4 space-y-2 ${
              isUser
                ? 'bg-indigo-600/25 border border-indigo-500/40 text-white'
                : 'bg-slate-900/95 border border-slate-800 text-slate-100'
            }">
              <div class="flex items-center justify-between gap-3 text-[11px] ${isUser ? 'text-indigo-200' : 'text-slate-400'}">
                <span class="font-bold">${isUser ? 'Vous' : 'Nexus AI'}</span>
                <div class="flex items-center gap-2">
                  ${!isUser ? `<button type="button" onclick="copyMessageAt(${index})" class="hover:text-white" title="Copier"><i class="fa-regular fa-copy"></i></button>` : ''}
                  ${!isUser ? `<button type="button" onclick="prepareMailFromMessageAt(${index})" class="hover:text-indigo-300" title="Envoyer par mail"><i class="fa-solid fa-envelope"></i></button>` : ''}
                </div>
              </div>
              <div>${isUser ? `<p class="text-xs sm:text-sm whitespace-pre-wrap leading-relaxed">${escapeHtml(msg.content)}</p>` : renderRichContent(msg.content)}</div>
            </div>
          </div>
        `;
      }).join('');

      box.scrollTop = box.scrollHeight;
    }

    function copyRawText(text) {
      navigator.clipboard?.writeText(String(text || ''));
    }

    function copyMessageAt(index) {
      const session = ensureActiveSession();
      const msg = session.messages[index];
      if (msg) copyRawText(msg.content);
    }

    function usePromptPreset(prefix) {
      const input = document.getElementById('user-prompt');
      if (!input) return;
      input.value = prefix + input.value;
      input.focus();
    }

    function attachTextFile(event) {
      const file = event.target?.files?.[0];
      if (!file) return;
      if (file.size > 250 * 1024) {
        alert('Fichier texte trop volumineux (max 250 Ko).');
        event.target.value = '';
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        attachedFileText = String(e.target?.result || '').replace(/\u0000/g, '').trim().slice(0, 12000);
        attachedFileName = file.name;
        const label = document.getElementById('attached-file-label');
        if (label) label.textContent = attachedFileText ? `Joint : ${file.name}` : '';
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function openMailDraftModal(prefillBody = '') {
      const session = ensureActiveSession();
      const lastAssistant = [...session.messages].reverse().find(m => m.role === 'assistant');
      const bodyEl = document.getElementById('draft-mail-body');
      const subjEl = document.getElementById('draft-mail-subject');
      if (bodyEl) bodyEl.value = prefillBody || lastAssistant?.content || '';
      if (subjEl && !subjEl.value) subjEl.value = session.title || 'Message Nexus AI';
      document.getElementById('mail-modal').classList.remove('hidden');
    }

    function prepareMailFromMessageAt(index) {
      const session = ensureActiveSession();
      const msg = session.messages[index];
      openMailDraftModal(msg?.content || '');
    }

    function closeMailDraftModal() {
      document.getElementById('mail-modal').classList.add('hidden');
    }

    async function submitMailDraft() {
      const to = (document.getElementById('draft-mail-to')?.value || '').trim();
      const subject = (document.getElementById('draft-mail-subject')?.value || 'Message Nexus AI').trim();
      const body = (document.getElementById('draft-mail-body')?.value || '').trim();
      const feedback = document.getElementById('draft-mail-feedback');
      if (!body) return alert('Le contenu du message est vide.');

      if (settings.webhookUrl) {
        try {
          if (feedback) feedback.textContent = 'Envoi en cours via endpoint configuré...';
          const res = await fetch(settings.webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type: 'email', to, subject, body, sentAt: new Date().toISOString() })
          });
          if (res.ok) {
            if (feedback) feedback.innerHTML = `<span class="text-emerald-400">Message transmis à ${escapeHtml(to || 'destinataire')}.</span>`;
            return;
          }
        } catch (_) {}
      }

      if (to) {
        window.location.href = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body.slice(0, 1800))}`;
        if (feedback) feedback.innerHTML = `<span class="text-emerald-400">Client mail ouvert pour ${escapeHtml(to)}.</span>`;
      } else {
        copyRawText(`Objet : ${subject}\n\n${body}`);
        if (feedback) feedback.innerHTML = `<span class="text-amber-300">Aucune adresse saisie : brouillon copié dans le presse-papiers.</span>`;
      }
    }
  </script>
  <script>
    function buildSystemPrompt(mode, style) {
      const modeInstructions = {
        omni: 'Tu es Nexus AI, un assistant polyvalent capable de raisonner, analyser, calculer, rédiger, comparer des options et produire du code propre et utile.',
        reasoning: 'Tu es en mode Raisonnement profond : décompose le problème étape par étape, explicite les hypothèses, vérifie la logique et les calculs, puis conclus clairement.',
        code: 'Tu es en mode Ingénieur Code : fournis des solutions techniques claires, structurées, sécurisées et commentées dans des blocs de code ```langage ... ```.',
        analyst: 'Tu es en mode Analyste & Chiffres : structure les données, vérifie les calculs, compare les options dans un tableau Markdown et donne une recommandation argumentée.',
        writer: 'Tu es en mode Rédaction & Stratégie : rédige des textes clairs, percutants et bien organisés, adaptés au public visé et sans formules creuses.'
      };

      const styleInstructions = {
        concise: 'Sois concis, direct et va droit à l\'essentiel.',
        balanced: 'Sois clair, structuré et complet, avec une prochaine étape concrète.',
        deep: 'Approfondis chaque aspect important, anticipe les risques/limites et propose un plan détaillé.'
      };

      return [
        modeInstructions[mode] || modeInstructions.omni,
        styleInstructions[style] || styleInstructions.balanced,
        'Tiens compte de l\'historique de la conversation pour répondre avec cohérence.',
        'Si des informations manquent, indique brièvement ce qui est supposé plutôt que de bloquer.'
      ].join(' ');
    }

    function extractNumbersWithContext(text) {
      const matches = [...String(text || '').matchAll(/(?<!\w)(\d{1,3}(?:[\s\u00A0]\d{3})+(?:[.,]\d+)?|\d+(?:[.,]\d+)?)\s*(%|fcfa|cfa|xof|eur|€|\$|usd|jours?|semaines?|mois|ans?)?/gi)];
      return matches
        .map(m => ({
          val: Number(m[1].replace(/[\s\u00A0]+/g, '').replace(',', '.')),
          unit: (m[2] || '').trim()
        }))
        .filter(x => !Number.isNaN(x.val) && x.val > 0);
    }

    function buildLocalReasonedFallback(prompt, session, mode, style) {
      const cleanPrompt = String(prompt || '').trim();
      const lower = cleanPrompt.toLowerCase();
      const nums = extractNumbersWithContext(cleanPrompt);
      const turnCount = session.messages.filter(m => m.role === 'user').length;

      if (/\b(code|fonction|script|javascript|python|html|css|sql|bug|erreur|api)\b/i.test(lower) || mode === 'code') {
        return [
          `**Analyse technique (${turnCount > 1 ? 'suite de conversation' : 'nouvelle demande'}) :**`,
          `Objectif identifié : ${cleanPrompt}`,
          '',
          '```javascript',
          'function processTask(input) {',
          '  if (!input || typeof input !== "string") {',
          '    return { ok: false, error: "Entrée invalide ou vide" };',
          '  }',
          '  const normalized = input.trim();',
          '  return { ok: true, length: normalized.length, summary: normalized.slice(0, 120) };',
          '}',
          '```',
          '',
          '**Points de contrôle :** valider les entrées, gérer les erreurs explicitement et tester les cas limites. Précisez le langage ou le framework souhaité pour adapter cet extrait.'
        ].join('\n');
      }

      if (/\b(compar|option|budget|calcul|tva|coût|cout|rentab|chiffre|analyse)\b/i.test(lower) || mode === 'analyst' || nums.length >= 2) {
        const numText = nums.length
          ? nums.map(n => `${n.val.toLocaleString('fr-FR')}${n.unit ? ' ' + n.unit : ''}`).join(' | ')
          : 'Aucun chiffre explicite fourni';

        return [
          `**Analyse structurée :**`,
          `Sujet : ${cleanPrompt}`,
          `Repères numériques détectés : ${numText}`,
          '',
          '| Dimension | Approche A (Progressive) | Approche B (Accélérée) | Critère clé |',
          '| --- | --- | --- | --- |',
          '| Mise en œuvre | Contrôlée, étapes validées | Rapide, fort engagement | Tolérance au risque |',
          '| Ressources | Étalées dans le temps | Concentrées au départ | Trésorerie / capacité |',
          '| Suivi | Ajustements fréquents | Objectifs à fort impact | Pilotage des écarts |',
          '',
          '**Recommandation :** Valider d\'abord les hypothèses chiffrées clés avant d\'engager les ressources principales.'
        ].join('\n');
      }

      const depthNote = style === 'deep'
        ? ' inclut une décomposition des étapes, les risques principaux et les critères de réussite.'
        : (style === 'concise'
          ? ' va directement à l\'essentiel.'
          : ' structure la réponse en étapes claires et actionnables.');

      return [
        `**Raisonnement et réponse${depthNote.replace(/\.$/, '')} :**`,
        `Demande traitée : ${cleanPrompt}`,
        '',
        `- **Compréhension de l'intention :** Clarifier l'objectif concret et le résultat attendu${turnCount > 1 ? ' en continuité avec nos échanges précédents' : ''}.`,
        `- **Hypothèses & cadre :** Les paramètres non précisés sont traités comme ajustables afin de produire une base exploitable immédiatement.`,
        `- **Plan d'action :** 1) Cadrer le périmètre exact ; 2) Exécuter la première étape vérifiable ; 3) Vérifier le résultat et ajuster.`,
        '',
        '**Prochaine étape :** Ajoutez vos contraintes spécifiques (délais, budget, public ou exemple) pour affiner cette réponse.'
      ].join('\n');
    }

    async function sendMessage() {
      const inputEl = document.getElementById('user-prompt');
      const sendBtn = document.getElementById('send-btn');
      const rawInput = (inputEl?.value || '').trim();

      const combinedPrompt = attachedFileText
        ? `${rawInput || 'Analyse ce document joint.'}\n\n[Fichier : ${attachedFileName}]\n${attachedFileText}`
        : rawInput;

      if (!combinedPrompt) return;

      const session = ensureActiveSession();
      if (session.messages.filter(m => m.role === 'user').length === 0) {
        session.title = (rawInput || attachedFileName || 'Conversation').slice(0, 42);
      }

      session.messages.push({
        role: 'user',
        content: combinedPrompt,
        timestamp: new Date().toISOString()
      });
      session.updatedAt = new Date().toISOString();

      inputEl.value = '';
      attachedFileText = '';
      attachedFileName = '';
      const fileLabel = document.getElementById('attached-file-label');
      if (fileLabel) fileLabel.textContent = '';

      persistSessions();
      renderSessions();
      renderMessages();

      sendBtn.disabled = true;
      sendBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

      let replyText = '';
      const systemPrompt = buildSystemPrompt(settings.mode, settings.style);

      const historyContents = session.messages.slice(-12).map(m => ({
        role: m.role === 'assistant' ? 'model' : 'user',
        parts: [{ text: m.content }]
      }));

      try {
        if (settings.apiKey) {
          const res = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(settings.apiKey)}`,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                systemInstruction: { parts: [{ text: systemPrompt }] },
                contents: historyContents
              })
            }
          );
          const data = await res.json();
          if (res.ok && data?.candidates?.[0]?.content?.parts?.[0]?.text) {
            replyText = data.candidates[0].content.parts[0].text.trim();
          }
        }
      } catch (_) {}

      if (!replyText) {
        replyText = buildLocalReasonedFallback(combinedPrompt, session, settings.mode, settings.style);
      }

      session.messages.push({
        role: 'assistant',
        content: replyText,
        timestamp: new Date().toISOString()
      });
      session.updatedAt = new Date().toISOString();
      persistSessions();
      renderMessages();

      sendBtn.disabled = false;
      sendBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i>';
    }
  </script>
  <script>
    function getLastAssistantText() {
      const session = ensureActiveSession();
      const found = [...session.messages].reverse().find(m => m.role === 'assistant');
      return found ? found.content : '';
    }

    function summarizeCurrentThread() {
      const session = ensureActiveSession();
      const userMsgs = session.messages.filter(m => m.role === 'user');
      if (!userMsgs.length) {
        alert('Aucun échange à résumer pour le moment.');
        return;
      }

      const lastUser = userMsgs[userMsgs.length - 1].content.replace(/\s+/g, ' ').slice(0, 140);
      const lastBot = getLastAssistantText().split('\n').find(l => l.trim().length > 20) || 'Réponse générée.';

      const summaryPrompt = [
        `Fais une synthèse claire en 4 points des échanges de cette conversation.`,
        `Dernier sujet abordé : ${lastUser}`,
        `Point clé récent : ${lastBot.slice(0, 180)}`
      ].join('\n');

      const inputEl = document.getElementById('user-prompt');
      if (inputEl) {
        inputEl.value = summaryPrompt;
        sendMessage();
      }
    }

    function exportConversationMarkdown() {
      const session = ensureActiveSession();
      const lines = [
        `# ${session.title || 'Conversation Nexus AI'}`,
        `Mode : ${session.mode || settings.mode} | Mis à jour : ${new Date(session.updatedAt || Date.now()).toLocaleString('fr-FR')}`,
        ''
      ];

      for (const m of session.messages) {
        const speaker = m.role === 'user' ? '## Utilisateur' : '## Nexus AI';
        lines.push(speaker, '', m.content, '');
      }

      const blob = new Blob([lines.join('\n')], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${(session.title || 'nexus-ai-conversation').toLowerCase().replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '')}.md`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function openExternalSearchForTopic() {
      const inputEl = document.getElementById('user-prompt');
      const session = ensureActiveSession();
      const lastUser = [...session.messages].reverse().find(m => m.role === 'user')?.content || '';
      const query = (inputEl?.value || lastUser || '').trim().slice(0, 140);
      if (!query) {
        alert('Saisissez un sujet ou posez une question d\'abord.');
        return;
      }
      window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank', 'noopener,noreferrer');
    }

    function injectToolBarIntoChat() {
      const chatContainer = document.getElementById('chat-messages');
      const section = chatContainer?.parentElement;
      if (!section || document.getElementById('nexus-quick-tools')) return;

      const bar = document.createElement('div');
      bar.id = 'nexus-quick-tools';
      bar.className = 'px-3 sm:px-5 py-2 border-t border-slate-800/80 bg-slate-900/70 flex items-center justify-between gap-2 flex-wrap text-[11px]';
      bar.innerHTML = `
        <div class="flex items-center gap-2 flex-wrap">
          <button type="button" onclick="summarizeCurrentThread()" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-indigo-600 text-slate-200 hover:text-white transition">
            <i class="fa-solid fa-compress-alt mr-1 text-indigo-400"></i>Résumer le fil
          </button>
          <button type="button" onclick="openExternalSearchForTopic()" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-indigo-600 text-slate-200 hover:text-white transition">
            <i class="fa-solid fa-magnifying-glass mr-1 text-amber-400"></i>Recherche web
          </button>
          <button type="button" onclick="exportConversationMarkdown()" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-emerald-600 text-slate-200 hover:text-white transition">
            <i class="fa-solid fa-file-arrow-down mr-1 text-emerald-400"></i>Exporter .MD
          </button>
        </div>
        <span class="text-slate-400">Entrée = Envoyer • Maj+Entrée = Saut de ligne</span>
      `;

      section.insertBefore(bar, chatContainer.nextSibling);
    }
  </script>
  <script>
    window.addEventListener('error', (event) => {
      console.warn('Erreur interceptée dans Nexus AI :', event?.message || event);
    });

    window.addEventListener('unhandledrejection', (event) => {
      console.warn('Promesse rejetée interceptée dans Nexus AI :', event?.reason || event);
    });

    (function initNexusAI() {
      syncSettingsUI();
      ensureActiveSession();
      injectToolBarIntoChat();
      renderSessions();
      renderMessages();
    })();
  </script>
